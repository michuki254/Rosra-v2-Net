# CI/CD for ROSRA V2 on Azure App Service `rosra-dev`
# (RG: UNHAB-PRD-ROSRA, sub: UN-HABITAT-PROD).
#
# Flow on every push to main:
#   Build  ->  Deploy to the `staging` slot  ->  (manual approval)  ->  Swap staging into production
#
# The staging slot gives a review URL (https://rosra-dev-staging.azurewebsites.net)
# that runs the new build against the staging DB. Promotion to production is a
# zero-downtime slot swap, gated by an approval so nothing reaches prod unreviewed.
#
# ONE-TIME PREREQUISITES
#  Azure (run once with your UN admin account — see the az commands shared separately):
#   1. Create the `staging` slot on rosra-dev.
#   2. Create the staging Azure SQL DB `unhab-rosra-db-staging`.
#   3. On the `staging` slot, set DefaultConnection (-> staging DB) and
#      ASPNETCORE_ENVIRONMENT as SLOT (sticky) settings so they do NOT swap.
#  Azure DevOps:
#   1. Service connection (ARM) scoped to sub UN-HABITAT-PROD / RG UNHAB-PRD-ROSRA,
#      named exactly: Azure-RosraDev
#   2. Environments > create `rosra-dev-staging` and `rosra-dev-production`.
#      Add an Approval check on `rosra-dev-production` (the swap waits for it).

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - '**/*.md'
      - 'PROJECT-UPDATE-*.docx'
      - 'docs/**'
      - 'tools/**'

pr: none

variables:
  buildConfiguration: Release
  azureServiceConnection: Azure-RosraDev
  appName: rosra-dev
  stagingSlot: staging
  resourceGroup: UNHAB-PRD-ROSRA
  dotnetSdkVersion: 8.0.x
  projectPath: RosraApp.csproj

stages:
- stage: Build
  displayName: Build & publish
  jobs:
  - job: Build
    pool:
      vmImage: windows-latest
    steps:
    - task: UseDotNet@2
      displayName: Install .NET SDK $(dotnetSdkVersion)
      inputs:
        packageType: sdk
        version: $(dotnetSdkVersion)

    - task: DotNetCoreCLI@2
      displayName: Restore
      inputs:
        command: restore
        projects: $(projectPath)

    - task: DotNetCoreCLI@2
      displayName: Build
      inputs:
        command: build
        projects: $(projectPath)
        arguments: --configuration $(buildConfiguration) --no-restore

    - task: DotNetCoreCLI@2
      displayName: Publish (framework-dependent, zipped)
      inputs:
        command: publish
        publishWebProjects: false
        projects: $(projectPath)
        arguments: >-
          --configuration $(buildConfiguration)
          --no-build
          --output $(Build.ArtifactStagingDirectory)
          /p:UseAppHost=false
          /p:EnvironmentName=Production
        zipAfterPublish: true
        modifyOutputPath: false

    - task: PublishPipelineArtifact@1
      displayName: Publish pipeline artifact
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)
        artifact: webapp
        publishLocation: pipeline

- stage: DeployStaging
  displayName: Deploy to staging slot
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployStaging
    displayName: Deploy to rosra-dev / staging slot
    pool:
      vmImage: windows-latest
    environment: rosra-dev-staging
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: webapp

          - task: AzureWebApp@1
            displayName: Deploy to staging slot
            inputs:
              azureSubscription: $(azureServiceConnection)
              appType: webApp
              appName: $(appName)
              resourceGroupName: $(resourceGroup)
              deployToSlotOrASE: true
              slotName: $(stagingSlot)
              package: $(Pipeline.Workspace)/webapp/*.zip
              deploymentMethod: zipDeploy

- stage: SwapToProduction
  displayName: Swap staging into production
  dependsOn: DeployStaging
  condition: succeeded()
  jobs:
  - deployment: SwapProd
    displayName: Swap staging -> production (zero-downtime)
    pool:
      vmImage: windows-latest
    # Add an Approval check on this environment in Azure DevOps so the swap
    # waits for sign-off after staging has been reviewed.
    environment: rosra-dev-production
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureAppServiceManage@0
            displayName: Swap staging slot into production
            inputs:
              azureSubscription: $(azureServiceConnection)
              action: 'Swap Slots'
              webAppName: $(appName)
              resourceGroupName: $(resourceGroup)
              sourceSlot: $(stagingSlot)
              # target slot defaults to production
